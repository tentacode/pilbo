# - decode-uri-component@0.2.2 (expo-router > query-string@7): the patched releases are ESM-only,
#   which breaks query-string@7 (CommonJS require).
# - deepmerge@4.3.1 (@expo/config): no patched release published.
audit:
  ignore:
    - GHSA-vcc3-ghjq-m6fr
    - GHSA-qr28-fpjm-wq7f
    - GHSA-gcqx-w48m-w2h4
