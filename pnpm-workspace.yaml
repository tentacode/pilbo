allowBuilds:
  better-sqlite3: true
  "@swc/core": false
  esbuild: false
  unrs-resolver: true
overrides:
  esbuild@<0.24.3: ">=0.25.0 <0.26"
  glob@>=13 <14.0.2: ">=14.0.2 <15"
  minimatch@>=10 <11.0.1: ">=11.0.1 <12"
  node-forge@<1.4.1: ">=1.4.1 <2"
  uuid@<11.1.1: ">=11.1.1 <12"
  zod@<4.6.6: ">=4.6.6 <5"
