allowBuilds:
  better-sqlite3: true
  esbuild: false
  unrs-resolver: true
overrides:
  esbuild@<0.24.3: ">=0.25.0 <0.26"
  uuid@<11.1.1: ">=11.1.1 <12"
# Unfixable advisories, all in dev/build tooling, never shipped in the app bundle:
# - decode-uri-component@0.2.2 (expo-router > query-string@7): the patched releases are ESM-only,
#   which breaks query-string@7 (CommonJS require).
# - node-forge@1.4.0 (@expo/cli > @expo/code-signing-certificates): no patched release published.
# - braces@3.0.3 (metro-file-map > micromatch): no patched release published.
# - sprintf-js@1.0.3 (jest coverage > js-yaml@3 > argparse@1): no patched release published.
audit:
  ignore:
    - GHSA-vcc3-ghjq-m6fr
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-hp3w-g68c-fv3c
