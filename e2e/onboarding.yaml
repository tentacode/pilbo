appId: com.tentacode.pilbo.dev
name: Onboarding can be restarted from the settings
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Réglages"
    timeout: 60000
- tapOn: "Réglages"
- scrollUntilVisible:
    element:
      text: "Revoir la présentation"
    centerElement: true
- tapOn: "Revoir la présentation"
- assertVisible: "Vos médicaments, regroupés en prises"
- tapOn: "Continuer"
- assertVisible: "Un rappel, puis un autre"
- runFlow:
    when:
      visible: "Continuer"
    commands:
      - assertNotVisible: "Autoriser les notifications"
      - tapOn: "Continuer"
- runFlow:
    when:
      visible: "Plus tard"
    commands:
      - tapOn: "Plus tard"
- assertVisible: "Pilbo n'est pas une application médicale"
- tapOn: "J'ai compris"
- assertVisible: "Vos données restent sur ce téléphone"
- assertNotVisible: "Créer ma première prise"
- tapOn: "Revenir aux réglages"
- extendedWaitUntil:
    visible:
      text: "Langue de l'app"
    timeout: 5000
