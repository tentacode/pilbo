appId: com.tentacode.pilbo.dev
name: Pillbox lists the intakes
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Pilulier"
    timeout: 10000
- tapOn: "Pilulier"
- assertVisible:
    text: "08:20.*Lamictal 50 mg, quantité 1. Lithium 250 mg, quantité 1"
- assertVisible:
    text: "12:20.*Lithium 250 mg, quantité 1"
- scrollUntilVisible:
    element:
      text: "20:20.*Lithium 250 mg, quantité 2"
- scrollUntilVisible:
    element:
      text: "22:00.*Lamictal 100 mg, quantité 1. Prégabaline 50 mg, quantité 1. Quviviq 50 mg, quantité 1"
- scrollUntilVisible:
    element:
      text: "Hors planning"
- scrollUntilVisible:
    element:
      text: "Prazépam 25 mg, Si besoin"
