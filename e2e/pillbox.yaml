appId: com.tentacode.pilbo.dev
name: Pillbox lists the intakes
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Pilulier"
    timeout: 60000
- tapOn: "Pilulier"
- assertVisible:
    text: "08:20.*Magnésium 300 mg, quantité 1. Vitamine D 400 UI, quantité 1"
- assertVisible:
    text: "12:20.*Magnésium 300 mg, quantité 1"
- scrollUntilVisible:
    element:
      text: "20:20.*Magnésium 300 mg, quantité 2"
- scrollUntilVisible:
    element:
      text: "22:00.*Fer 80 mg, quantité 1. Mélatonine 1 mg, quantité 1. Vitamine D 1000 UI, quantité 1"
