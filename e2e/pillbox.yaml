appId: com.tentacode.pilbo
name: Pillbox lists the intakes
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Autoriser"
    commands:
      - tapOn: "Autoriser"
- extendedWaitUntil:
    visible: "Pilulier"
    timeout: 10000
- tapOn: "Pilulier"
- assertVisible:
    text: "8 h 20.*Lamictal 50 mg, quantité 1. Lithium 250 mg, quantité 1"
- assertVisible:
    text: "12 h 20.*Lithium 250 mg, quantité 1"
- scrollUntilVisible:
    element:
      text: "20 h 20.*Lithium 250 mg, quantité 2"
- scrollUntilVisible:
    element:
      text: "22 h.*Lamictal 100 mg, quantité 1. Prégabaline 50 mg, quantité 1. Quviviq 50 mg, quantité 1"
- scrollUntilVisible:
    element:
      text: "Prazépam.*"
