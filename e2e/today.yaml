appId: com.tentacode.pilbo.dev
name: Today lists the intakes of the day
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Aujourd'hui"
    timeout: 10000
- assertVisible:
    text: "Aujourd'hui"
- evalScript: |
    ${
      const days = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
      const months = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
      const now = new Date();
      output.today = days[now.getDay()] + " " + now.getDate() + " " + months[now.getMonth()] + " " + now.getFullYear();
    }
- assertVisible:
    text: ${output.today}
- scrollUntilVisible:
    element:
      text: "12:20.*"
- scrollUntilVisible:
    element:
      text: "20:20.*"
- scrollUntilVisible:
    element:
      text: "Lithium 250 mg, Avec le repas, quantité 2"
- scrollUntilVisible:
    element:
      text: "22:00.*"
- scrollUntilVisible:
    element:
      text: "Quviviq 50 mg, quantité 1"
- scrollUntilVisible:
    element:
      text: "Déjà prise"
- scrollUntilVisible:
    element:
      text: "08:20, Pris en retard à 09:35, Lamictal 50 mg, quantité 1, Lithium 250 mg, quantité 1"
- scrollUntilVisible:
    element:
      text: "Hors planning"
- scrollUntilVisible:
    element:
      text: "Prazépam 25 mg, Si besoin"
