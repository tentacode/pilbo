appId: com.tentacode.pilbo.dev
name: Today lists the intakes of the day
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Aujourd'hui"
    timeout: 60000
- assertVisible:
    text: "Aujourd'hui"
- evalScript: |
    ${
      const days = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
      const months = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
      const now = new Date();
      output.today = days[now.getDay()] + " " + now.getDate() + " " + months[now.getMonth()] + " " + now.getFullYear();
    }
- assertVisible:
    text: ${output.today}
- scrollUntilVisible:
    element:
      text: "12:20.*"
- scrollUntilVisible:
    element:
      text: "20:20.*"
- scrollUntilVisible:
    element:
      text: "Magnésium 300 mg, Avec le repas, quantité 2"
- scrollUntilVisible:
    element:
      text: "22:00.*"
- scrollUntilVisible:
    element:
      text: "Mélatonine 1 mg, quantité 1"
- scrollUntilVisible:
    element:
      text: "Déjà prise"
- scrollUntilVisible:
    element:
      text: "08:20, Pris en retard à 09:35, Magnésium 300 mg, quantité 1, Vitamine D 400 UI, quantité 1"
