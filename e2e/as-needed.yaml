appId: com.tentacode.pilbo.dev
name: An as needed med can be taken and its last intake cancelled from today
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Pilulier"
    timeout: 10000
- tapOn: "Pilulier"
- scrollUntilVisible:
    element:
      text: "Ajouter un médicament"
    centerElement: true
- tapOn: "Ajouter un médicament"
- tapOn: "Ajouter Lithium 250 mg, Avec le repas"
- scrollUntilVisible:
    element:
      text: "Lithium 250 mg, Avec le repas"
- tapOn: "Aujourd'hui.*"
- scrollUntilVisible:
    element:
      text: "Prendre Lithium 250 mg"
    centerElement: true
- tapOn: "Prendre Lithium 250 mg"
- tapOn: "Prendre Lithium 250 mg"
- scrollUntilVisible:
    element:
      text: "Pris à \\d\\d:\\d\\d"
    centerElement: true
- tapOn: "Annuler la prise de Lithium 250 mg de \\d\\d:\\d\\d"
- assertVisible: "Pris à \\d\\d:\\d\\d"
- tapOn: "Annuler la prise de Lithium 250 mg de \\d\\d:\\d\\d"
- assertNotVisible: "Pris à \\d\\d:\\d\\d"
- assertVisible: "Prendre Lithium 250 mg"
