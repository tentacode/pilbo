appId: com.tentacode.pilbo.dev
name: The app language can be changed
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Réglages"
    timeout: 10000
- tapOn: "Réglages"

# English
- scrollUntilVisible:
    element:
      text: "English"
    centerElement: true
- tapOn: "English"
- assertVisible: "App language"
- scrollUntilVisible:
    element:
      text: "Reminders"
    direction: UP
- assertVisible: "Notifications: .*"

# Tabs and Today
- tapOn: "Today.*"
- assertVisible: "Today"
- assertVisible: "Pillbox"
- assertVisible: "Meds.*"
- tapOn: "Meds.*"
- assertVisible: "Lithium 250 mg, low stock, .*"
- tapOn: "Pillbox"
- assertVisible: "New intake"

# Back to French
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Français"
    centerElement: true
- tapOn: "Français"
- assertVisible: "Langue de l'app"
- scrollUntilVisible:
    element:
      text: "Rappels"
    direction: UP
- assertVisible: "Notifications : .*"
- assertVisible: "Aujourd'hui.*"
