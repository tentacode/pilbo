name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  static-analysis:
    name: "⚙️ Static analysis & unit tests"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm i --frozen-lockfile

      - name: Lint
        run: pnpm run lint --max-warnings=0

      - name: Prettier
        run: pnpm run prettier:check --log-level warn

      - name: Typescript
        run: pnpm run typescript

      - name: Unit tests
        run: pnpm run test

      - name: Audit
        run: pnpm audit
