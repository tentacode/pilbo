name: Website

concurrency:
  group: website
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: ["main"]
    paths: ["website/**", ".github/workflows/website.yaml"]
  workflow_dispatch:

jobs:
  deploy:
    name: "🌐 Deploy to GitHub Pages"
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v5
